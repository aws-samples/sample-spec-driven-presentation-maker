[project]
name = "sdpm-api"
version = "1.0.0"
description = "spec-driven-presentation-maker REST API Lambda (Layer 4)"
requires-python = ">=3.11"
# Versions are locked in the workspace uv.lock (root); scripts/bundle_api_lambda.sh
# bundles from it. api/ needs sdpm/sdpm only for sdpm.engine.analyzer (template listing
# and uploaded-template analysis); sdpm-skill brings its dependencies, and with them the
# core's document parsers, which api/ does not import. The bundle copies sdpm/sdpm itself.
dependencies = [
    "sdpm-skill",
    "aws-lambda-powertools[all]>=2.0.0",
    "boto3>=1.34.0",
]

# An application, not a library: uv installs its dependencies, never builds it.
[tool.uv]
package = false

[tool.uv.sources]
sdpm-skill = { workspace = true }
