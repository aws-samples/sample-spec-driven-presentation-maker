[project]
name = "sdpm-api"
version = "1.0.0"
description = "spec-driven-presentation-maker REST API Lambda (Layer 4)"
requires-python = ">=3.11"
# Versions are locked in the workspace uv.lock (root); scripts/bundle_api_lambda.sh
# bundles from it. sdpm-skill brings the engine's own dependencies (python-pptx, lxml, …)
# for shared.ingest's upload-time PPTX conversion; the bundle copies sdpm/sdpm itself.
dependencies = [
    "sdpm-skill",
    "aws-lambda-powertools[all]>=2.0.0",
    "boto3>=1.34.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
]

# An application, not a library: uv installs its dependencies, never builds it.
[tool.uv]
package = false

[tool.uv.sources]
sdpm-skill = { workspace = true }
