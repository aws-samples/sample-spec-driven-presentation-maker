[project]
name = "sdpm-agent"
version = "1.0.0"
description = "spec-driven-presentation-maker Strands Agent — AgentCore Runtime container (Layer 4)"
requires-python = ">=3.11"
# AI model access requires appropriate IAM permissions and Bedrock model access grants.
# Versions are locked in the workspace uv.lock (root); agent/Dockerfile installs from it.
dependencies = [
    # >=1.56.0: the floor bedrock-agentcore's [strands-agents] extra set for its memory
    # integration (session_manager), which the agent uses.
    "strands-agents[otel]>=1.56.0",
    "mcp>=2.3.0,<3",
    # No [strands-agents] extra: it caps mcp <2, and strands-agents is declared above.
    "bedrock-agentcore>=1.0.6",
    "aws-opentelemetry-distro>=0.10.0",
    "awslabs.aws-pricing-mcp-server",
    # web_fetch: decodes pages that declare no charset.
    "charset-normalizer",
    "html2text",
    "pymupdf",
    "partial-json-parser",
]

# An application, not a library: uv installs its dependencies, never builds it.
[tool.uv]
package = false
