version: 2
updates:
  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major bumps routinely break the toolchain (e.g. typescript 5->7 broke
    # typescript-eslint; eslint 9->10). Handle majors manually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-ui-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      infra-deps:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /servers/local
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /servers/remote
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
