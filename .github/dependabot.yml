version: 2
updates:
  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors arrive as their own grouped PR (never mixed into the weekly
    # minor/patch group — that mixing was the problem #241 solved by blanket
    # exclusion). CI (tsc / eslint / tests / build:cloud) is the first-pass
    # verification; merge or close with the upstream-blocker evidence.
    #
    # Known-blocked majors are ignored below so the majors PR stays green.
    # Re-evaluation triggers:
    # - typescript >=7: until typescript-eslint supports TS >=7.1
    #   (typescript-eslint#10940)
    # - eslint >=10: until eslint-config-next ships an eslint-plugin-react
    #   with eslint 10 peer support (crashes on removed getFilename API)
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
    groups:
      web-ui-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-ui-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Known-blocked majors (same policy as /web-ui above):
    # - typescript >=6: TS 6/7 fail `tsc --noEmit` for the CDK app — node
    #   globals/type resolution breaks repo-wide (TS2591 "Cannot find name
    #   'process'/'fs'/'path'", TS2304 __dirname). Isolated locally: fails
    #   with both @types/node 22 and 26, while TS 5.9 + @types/node 26 is
    #   clean — so the blocker is the compiler, not the types. Re-evaluate
    #   when the CDK toolchain supports TS >=6 (PR #258 / #298 CI logs).
    ignore:
      - dependency-name: "typescript"
        versions: [">=6"]
    groups:
      infra-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      infra-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: pip
    directory: /sdpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /servers/local
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # mcp 2.0 removes mcp.server.fastmcp (FastMCP) — the server fails at
      # import. Requires migration to mcp.server.mcpserver.MCPServer,
      # tracked in #301. Remove this once migrated.
      - dependency-name: mcp
        versions: [">=2"]
  - package-ecosystem: pip
    directory: /servers/remote
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # constraints.txt is generated by `make lock` (uv pip compile) from
      # pyproject.toml. Direct bumps of transitive pins break resolution:
      # aws-opentelemetry-distro==0.19.0 hard-pins cachetools==6.2.4 and
      # bounds protobuf<7 (deploy 2026-08-02 failed on both — CI has no
      # docker build, so this only surfaces at deploy time). Re-evaluate
      # when aws-opentelemetry-distro is bumped, then run `make lock`.
      - dependency-name: cachetools
      - dependency-name: protobuf
      # pydantic-core is hard-pinned by pydantic (mcp -> pydantic==X pins
      # pydantic-core==Y exactly). Bumping it alone makes the container
      # image unresolvable (PR #271 broke main; caught by container-deps).
      # It moves automatically when pydantic itself is bumped via `make lock`.
      - dependency-name: pydantic-core
      # mcp 2.0 removes mcp.server.fastmcp (FastMCP) — see /servers/local
      # entry above. Migration tracked in #301.
      - dependency-name: mcp
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
