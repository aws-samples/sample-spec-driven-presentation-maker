version: 2
# Every entry carries a `*-security` group: without it, security updates
# bypass `groups` and arrive as one PR per package. Since every npm/uv
# security PR touches the same lockfile, each merge sent the rest back
# through rebase + CI (19 open PRs piled up by 2026-10-30).
updates:
  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors arrive as their own grouped PR (never mixed into the weekly
    # minor/patch group — that mixing was the problem #241 solved by blanket
    # exclusion). CI (tsc / eslint / tests / build:cloud) is the first-pass
    # verification; merge or close with the upstream-blocker evidence.
    #
    # Known-blocked majors are ignored below so the majors PR stays green.
    # Re-evaluation triggers:
    # - typescript >=7: until typescript-eslint supports TS >=7.1
    #   (typescript-eslint#10940)
    # - eslint >=10: until eslint-config-next ships an eslint-plugin-react
    #   with eslint 10 peer support (crashes on removed getFilename API)
    #
    # package.json `overrides` (not a cap; a security floor):
    # - @tailwindcss/typography > postcss-selector-parser ^6.1.5: 0.5.20 pins
    #   6.0.10 exactly (GHSA-rj75-hqrm-r3gf, fixed in 6.1.5), so the security
    #   update could only downgrade the plugin. Built CSS is byte-identical.
    #   Remove when a typography release drops the pin
    #   (tailwindcss-typography#431 / #430).
    #
    # Security updates that still fail upstream, no fix on our side:
    # - minimatch GHSA-g3hv-75wg-m249 is fixed only in 11.x; typescript-estree
    #   and @ts-morph/common (dev) require ^10 (typescript-eslint#13125).
    #   Same advisory in /infra, see below.
    # - deepmerge GHSA-gcqx-w48m-w2h4 (via shadcn CLI, dev) has no patched
    #   release.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
    groups:
      web-ui-security:
        applies-to: security-updates
        patterns: ["*"]
      web-ui-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-ui-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Known-blocked majors (same policy as /web-ui above):
    # - typescript >=6: TS 6/7 fail `tsc --noEmit` for the CDK app — node
    #   globals/type resolution breaks repo-wide (TS2591 "Cannot find name
    #   'process'/'fs'/'path'", TS2304 __dirname). Isolated locally: fails
    #   with both @types/node 22 and 26, while TS 5.9 + @types/node 26 is
    #   clean — so the blocker is the compiler, not the types. Re-evaluate
    #   when the CDK toolchain supports TS >=6 (PR #258 / #298 CI logs).
    #
    # The minimatch security update (GHSA-g3hv-75wg-m249, fixed only in 11.x)
    # fails here until aws-cdk-lib bundles minimatch >=11.0.1. It is in
    # aws-cdk-lib's bundleDependencies, so `overrides` cannot reach it
    # (aws/aws-cdk#39594, fix in aws/aws-cdk#39595). Picked up by the regular
    # aws-cdk-lib bump once released.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6"]
    groups:
      infra-security:
        applies-to: security-updates
        patterns: ["*"]
      infra-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      infra-majors:
        patterns: ["*"]
        update-types: ["major"]
  # Python: one uv workspace, one lock (uv.lock at the root) for every member —
  # sdpm, servers/local, servers/remote, agent, api. Dependabot's uv updater
  # re-resolves the whole lock for each update, so it never proposes a version
  # another member's pin rules out (the old constraints.txt failure mode).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # pyproject.toml holds the supported ranges, uv.lock the exact versions; an
    # update moves the lock inside the range. A deliberate cap (mcp <2, #301) is
    # therefore the one place that stops a major — no ignore entry needed. It also
    # avoids dependabot-core #15786 (grouped updates rewriting unrelated
    # requirements in a member's pyproject.toml).
    versioning-strategy: lockfile-only
    ignore:
      # dependabot-core #14004: the workspace members themselves get proposed as
      # external dependencies.
      - dependency-name: sdpm-skill
      - dependency-name: sdpm-mcp-local
      - dependency-name: sdpm-mcp-server
      - dependency-name: sdpm-agent
      - dependency-name: sdpm-api
    groups:
      # One PR a week for minor/patch, a separate one for majors (not auto-merged),
      # security updates grouped on their own.
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-majors:
        patterns: ["*"]
        update-types: ["major"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
