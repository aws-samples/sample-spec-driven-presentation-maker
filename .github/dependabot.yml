version: 2
updates:
  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors arrive as their own grouped PR (never mixed into the weekly
    # minor/patch group — that mixing was the problem #241 solved by blanket
    # exclusion). CI (tsc / eslint / tests / build:cloud) is the first-pass
    # verification; merge or close with the upstream-blocker evidence.
    #
    # Known-blocked majors are ignored below so the majors PR stays green.
    # Re-evaluation triggers:
    # - typescript >=7: until typescript-eslint supports TS >=7.1
    #   (typescript-eslint#10940)
    # - eslint >=10: until eslint-config-next ships an eslint-plugin-react
    #   with eslint 10 peer support (crashes on removed getFilename API)
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
    groups:
      web-ui-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-ui-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      infra-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      infra-majors:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: pip
    directory: /sdpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /servers/local
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /servers/remote
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
