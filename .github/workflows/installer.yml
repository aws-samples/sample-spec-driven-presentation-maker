name: Installer

on:
  push:
    branches: [main, 'dev/**']
    paths:
      - "scripts/install/**"
      - "servers/local/client_config.py"
      - "sdpm/sdpm/_launcher_bridge.py"
      - "sdpm/sdpm/knowledge/assets/download.py"
      - "servers/local/pyproject.toml"
      - ".gitignore"
      - ".github/workflows/installer.yml"
  pull_request:
    branches: [main, 'dev/**']
    paths:
      - "scripts/install/**"
      - "servers/local/client_config.py"
      - "sdpm/sdpm/_launcher_bridge.py"
      - "sdpm/sdpm/knowledge/assets/download.py"
      - "servers/local/pyproject.toml"
      - ".gitignore"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

jobs:
  generated-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated installer drift
        run: bash scripts/install/build.sh --check

  # The real thing on every OS: install the MCP-only profile from this checkout into an
  # isolated home, then prove the launcher path with an MCP handshake over `sdpm mcp`.
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [[ "${RUNNER_OS}" == "macOS" ]]; then brew install shellcheck
            else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          fi
      - name: Shellcheck
        shell: bash
        run: shellcheck scripts/install/*.sh scripts/install/lib/*.sh scripts/install/dist/install.sh
      - name: Install (mcp-only) into an isolated home
        shell: bash
        run: |
          # The installer clones "main"; serve this PR's tree under that name from a local mirror.
          MIRROR="$(mktemp -d)/mirror.git"
          git clone -q --bare . "$MIRROR"
          git -C "$MIRROR" branch -f main HEAD
          # A path with a space: the failure mode that quoting bugs hide behind.
          export SDPM_HOME="$(mktemp -d)/sdpm home/.sdpm" SDPM_LAUNCHER_DIR="$(mktemp -d)/bin"
          export SDPM_REPO_URL="$MIRROR"
          echo "SDPM_HOME=$SDPM_HOME" >> "$GITHUB_ENV"; echo "SDPM_LAUNCHER_DIR=$SDPM_LAUNCHER_DIR" >> "$GITHUB_ENV"
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/install/dist/install.sh --mcp-only --non-interactive --skip-libreoffice --no-register
      - name: Launcher — status, config, dry-run registration
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          "$SDPM_LAUNCHER_DIR/sdpm"
          "$SDPM_LAUNCHER_DIR/sdpm" mcp-config --all --json > config.json
          python3 -c '
          import json; d = json.load(open("config.json")); s = d["server"]["sdpm"]
          assert s["command"].startswith("/"), s
          assert s["args"][2].endswith("/servers/local"), s
          assert not any("uvx" in a or "sdpm" == a for a in s["args"]), s
          print("config OK:", s["command"])'
          "$SDPM_LAUNCHER_DIR/sdpm" register --dry-run | tee register.log
          ! grep -q "^kiro-cli\|^claude\|^code\|^codex" register.log   # dry-run never executes
      - name: MCP handshake over `sdpm mcp`
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/install/mcp_smoke.py "$SDPM_LAUNCHER_DIR/sdpm" mcp
      - name: MCP handshake over the client command
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'EOF'
          import json, subprocess, sys
          s = json.load(open("config.json"))["server"]["sdpm"]
          sys.exit(subprocess.call([sys.executable, "scripts/install/mcp_smoke.py", s["command"], *s["args"]]))
          EOF
      - name: Idempotent re-run
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          MIRROR="$(mktemp -d)/mirror.git"; git clone -q --bare . "$MIRROR"; git -C "$MIRROR" branch -f main HEAD
          SDPM_REPO_URL="$MIRROR" bash scripts/install/dist/install.sh --mcp-only --non-interactive --skip-libreoffice --no-register
          "$SDPM_LAUNCHER_DIR/sdpm" version
      # Every install made before the refresh step carries the #397 launcher, which never
      # replaced itself. Its `sdpm update` must leave the install as a new one would.
      - name: Update from the #397 launcher
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export KIRO_HOME="$(mktemp -d)/kiro"
          checkout="$SDPM_HOME/checkout"
          git show 7c53267d:scripts/install/launcher.sh > "$SDPM_LAUNCHER_DIR/sdpm"
          # What such an install has: a Kiro agent in the 2.x-only format, the pre-0.12
          # environments, and a checkout behind main.
          mkdir -p "$KIRO_HOME/agents"
          echo '{"name": "sdpm", "description": "SDPM (managed by `sdpm register`)", "tools": ["@sdpm"]}' > "$KIRO_HOME/agents/sdpm.json"
          for venv in servers/local/.venv sdpm/.venv; do mkdir -p "$checkout/$venv"; echo "home = /usr/bin" > "$checkout/$venv/pyvenv.cfg"; done
          git -C "$checkout" reset -q --hard HEAD~1
          "$SDPM_LAUNCHER_DIR/sdpm" update | tee update.log
          grep -q "Refreshing the sdpm command and MCP clients (once" update.log
          cmp "$SDPM_LAUNCHER_DIR/sdpm" scripts/install/launcher.sh
          test -x "$SDPM_LAUNCHER_DIR/sdpm"
          test ! -e "$checkout/servers/local/.venv" && test ! -e "$checkout/sdpm/.venv"
          python3 -c '
          import json, os; a = json.load(open(os.environ["KIRO_HOME"] + "/agents/sdpm.json"))
          assert a["permissions"]["rules"] and "subagent/sdpm" in a["tools"], a
          assert a["mcpServers"]["sdpm"]["command"].startswith("/"), a
          print("kiro agent OK")'
          python3 scripts/install/mcp_smoke.py "$SDPM_LAUNCHER_DIR/sdpm" mcp
          # The new launcher refreshes by itself; the bridge stays out of it.
          "$SDPM_LAUNCHER_DIR/sdpm" update | tee update2.log
          if grep -q "(once" update2.log; then echo "the bridge ran for a new launcher" >&2; exit 1; fi
          grep -q "sdpm command: up to date" update2.log

  full-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install (full) into an isolated home
        shell: bash
        run: |
          MIRROR="$(mktemp -d)/mirror.git"; git clone -q --bare . "$MIRROR"; git -C "$MIRROR" branch -f main HEAD
          export SDPM_HOME="$(mktemp -d)/.sdpm" SDPM_LAUNCHER_DIR="$(mktemp -d)/bin" SDPM_REPO_URL="$MIRROR"
          echo "SDPM_HOME=$SDPM_HOME" >> "$GITHUB_ENV"; echo "SDPM_LAUNCHER_DIR=$SDPM_LAUNCHER_DIR" >> "$GITHUB_ENV"
          export PATH="$HOME/.local/bin:$PATH"
          # kiro-cli is a Web UI runtime dependency; the installer offers it but CI has no login, so skip its install.
          SDPM_SKIP_KIRO_CLI=1 bash scripts/install/dist/install.sh --full --non-interactive --skip-libreoffice --skip-shortcut --no-register
      - name: Web UI build present, launcher knows it
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          test -d "$SDPM_HOME/checkout/web-ui/build"
          test "$(cat "$SDPM_HOME/.profile")" = full
          "$SDPM_LAUNCHER_DIR/sdpm" | tee status.log
          grep -q "webui      installed" status.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell sources
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts/install -Recurse -Filter *.ps1
          $findings = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }
      - name: Install (mcp-only) into an isolated home
        shell: pwsh
        run: |
          $mirror = Join-Path ([IO.Path]::GetTempPath()) ("mirror-" + [guid]::NewGuid() + ".git")
          git clone -q --bare . $mirror
          git -C $mirror branch -f main HEAD
          # A path with a space: the failure mode that quoting bugs hide behind.
          $env:SDPM_HOME = Join-Path ([IO.Path]::GetTempPath()) ("sdpm home " + [guid]::NewGuid())
          $env:SDPM_LAUNCHER_DIR = Join-Path ([IO.Path]::GetTempPath()) ("bin-" + [guid]::NewGuid())
          $env:SDPM_REPO_URL = $mirror
          "SDPM_HOME=$env:SDPM_HOME" >> $env:GITHUB_ENV
          "SDPM_LAUNCHER_DIR=$env:SDPM_LAUNCHER_DIR" >> $env:GITHUB_ENV
          & ./scripts/install/dist/install.ps1 -McpOnly -NonInteractive -SkipLibreOffice -NoRegister
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launcher — status, config, dry-run registration
        shell: pwsh
        run: |
          $sdpm = Join-Path $env:SDPM_LAUNCHER_DIR "sdpm.cmd"
          & $sdpm
          & $sdpm mcp-config --all --json | Out-File -Encoding utf8 config.json
          $s = (Get-Content config.json -Raw | ConvertFrom-Json).server.sdpm
          if (-not [IO.Path]::IsPathRooted($s.command)) { throw "uv path not absolute: $($s.command)" }
          if (-not $s.args[2].EndsWith("servers\local")) { throw "checkout path wrong: $($s.args[2])" }
          & $sdpm register --dry-run
      - name: MCP handshake over `sdpm mcp` and over the client command
        shell: pwsh
        run: |
          $sdpm = Join-Path $env:SDPM_LAUNCHER_DIR "sdpm.cmd"
          python scripts/install/mcp_smoke.py $sdpm mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $s = (Get-Content config.json -Raw | ConvertFrom-Json).server.sdpm
          python scripts/install/mcp_smoke.py $s.command @($s.args)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Update from the #397 launcher
        shell: pwsh
        run: |
          $env:KIRO_HOME = Join-Path ([IO.Path]::GetTempPath()) ("kiro-" + [guid]::NewGuid())
          $checkout = Join-Path $env:SDPM_HOME "checkout"
          $launcher = Join-Path $env:SDPM_LAUNCHER_DIR "sdpm.ps1"
          $sdpm = Join-Path $env:SDPM_LAUNCHER_DIR "sdpm.cmd"
          # As the installer of that version wrote it.
          git show "7c53267d:scripts/install/launcher.ps1" | Set-Content -Path $launcher -Encoding UTF8
          New-Item -ItemType Directory -Force -Path (Join-Path $env:KIRO_HOME "agents") | Out-Null
          '{"name": "sdpm", "description": "SDPM (managed by `sdpm register`)", "tools": ["@sdpm"]}' | Set-Content -Path (Join-Path $env:KIRO_HOME "agents\sdpm.json") -Encoding UTF8
          foreach ($venv in @("servers\local\.venv", "sdpm\.venv")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $checkout $venv) | Out-Null
            "home = C:\Python" | Set-Content -Path (Join-Path $checkout "$venv\pyvenv.cfg")
          }
          git -C $checkout reset -q --hard HEAD~1
          & $sdpm update | Tee-Object -FilePath update.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path update.log -SimpleMatch "Refreshing the sdpm command and MCP clients (once" -Quiet)) { throw "the bridge did not run" }
          if ((Get-Content $launcher -Raw) -ne (Get-Content (Join-Path $checkout "scripts\install\launcher.ps1") -Raw)) { throw "launcher not refreshed" }
          if ((Test-Path (Join-Path $checkout "servers\local\.venv")) -or (Test-Path (Join-Path $checkout "sdpm\.venv"))) { throw "leftovers remain" }
          $agent = Get-Content (Join-Path $env:KIRO_HOME "agents\sdpm.json") -Raw | ConvertFrom-Json
          if (-not $agent.permissions.rules -or -not [IO.Path]::IsPathRooted($agent.mcpServers.sdpm.command)) { throw "kiro agent not refreshed" }
          python scripts/install/mcp_smoke.py $sdpm mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdpm update | Tee-Object -FilePath update2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path update2.log -SimpleMatch "(once" -Quiet) { throw "the bridge ran for a new launcher" }
          if (-not (Select-String -Path update2.log -SimpleMatch "sdpm command: up to date" -Quiet)) { throw "launcher refreshed twice" }
