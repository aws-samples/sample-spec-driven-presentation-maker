name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Lint
        run: uv run ruff check sdpm/ servers/ shared/ api/
      - name: Test
        run: uv run pytest tests/ -v

  # Local-surface guard: boots servers/local over real stdio (no mocks) and
  # exercises filesystem-anchored resolution (templates, personas). The unit
  # suite mocks this surface, so regressions here used to slip through.
  local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Smoke test local MCP server
        run: uv run python scripts/smoke_local.py

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web-ui
      - name: Lint
        run: npm run lint
        working-directory: web-ui
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web-ui
      - name: Test
        run: npm test
        working-directory: web-ui
      - name: Build
        run: npm run build:cloud
        working-directory: web-ui

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web-ui
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web-ui
      - name: E2E test
        run: npm run test:e2e
        working-directory: web-ui
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web-ui/test-results/
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        run: npm ci
        working-directory: infra
      - name: Type check
        run: npx tsc --noEmit
        working-directory: infra

  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Deny cdk.context.json
        run: |
          if [ -f "infra/cdk.context.json" ]; then
            echo "::error::infra/cdk.context.json must not be committed"
            exit 1
          fi
      - name: Deny .env files
        run: |
          if compgen -G "**/.env" > /dev/null || compgen -G "**/.env.*" > /dev/null; then
            echo "::error::.env files must not be committed"
            exit 1
          fi
