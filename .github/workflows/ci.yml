name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Lint
        run: uv run ruff check sdpm/ servers/ shared/ api/ agent/
      - name: Test
        run: uv run pytest tests/ -v --cov=sdpm --cov-report=term

  # Local-surface guard: boots servers/local over real stdio (no mocks) and
  # exercises filesystem-anchored resolution (templates, personas). The unit
  # suite mocks this surface, so regressions here used to slip through.
  local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Smoke test local MCP server
        run: uv run python scripts/smoke_local.py

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web-ui
      - name: Lint
        run: npm run lint
        working-directory: web-ui
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web-ui
      - name: Test
        run: npm test
        working-directory: web-ui
      - name: Build
        run: npm run build:cloud
        working-directory: web-ui

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web-ui
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web-ui
      - name: E2E test
        run: npm run test:e2e
        working-directory: web-ui
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web-ui/test-results/
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        run: npm ci
        working-directory: infra
      - name: Type check
        run: npx tsc --noEmit
        working-directory: infra
      # cdk synth catches template-level errors that tsc cannot (e.g. invalid
      # lifecycle rule combinations only fail at CloudFormation/S3 API time,
      # but synth at least validates construct-level constraints and config).
      - name: Synth
        # config.yaml is a local deployment setting (gitignored) — synth against
        # the committed example config.
        run: |
          cp config.example.yaml config.yaml
          npx cdk synth --quiet
        working-directory: infra

  # Deploy-surface guard: the runtime docker builds resolve Python deps with
  # pip against committed lockfiles. CI has no docker build, so a lockfile
  # that pip cannot satisfy (e.g. a Dependabot bump contradicting a
  # transitive hard pin — cachetools/protobuf under aws-opentelemetry-distro,
  # 2026-08-02) used to surface only at deploy time. Reproduce the exact
  # docker-side installs as dry runs here.
  container-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Remote server image deps resolve (mirrors servers/remote/Dockerfile)
        run: |
          uv venv /tmp/remote-check --python 3.13
          VIRTUAL_ENV=/tmp/remote-check uv pip install --dry-run \
            -c servers/remote/constraints.txt ./sdpm ./servers/remote
      - name: Agent image deps resolve (mirrors agent/Dockerfile)
        run: |
          uv venv /tmp/agent-check --python 3.13
          VIRTUAL_ENV=/tmp/agent-check uv pip install --dry-run \
            -r agent/requirements.lock

  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deny cdk.context.json
        run: |
          if [ -f "infra/cdk.context.json" ]; then
            echo "::error::infra/cdk.context.json must not be committed"
            exit 1
          fi
      - name: Deny .env files
        run: |
          if compgen -G "**/.env" > /dev/null || compgen -G "**/.env.*" > /dev/null; then
            echo "::error::.env files must not be committed"
            exit 1
          fi
