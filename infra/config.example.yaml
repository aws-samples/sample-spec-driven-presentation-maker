# Deployment configuration for spec-driven-presentation-maker CDK stacks.
# Copy this file to config.yaml and customize.
#
# Layer 3 (MCP Server only):
#   stacks.data + stacks.runtime = true, everything else false
#
# Layer 4 (Full stack):
#   + stacks.agent + stacks.webUi = true

stacks:
  data: true           # Required — DynamoDB + S3
  runtime: true        # Required — AgentCore Runtime MCP Server
  agent: false         # Layer 4 — Strands Agent on AgentCore Runtime
  webUi: false         # Layer 4 — React Web UI (Amplify Hosting)

features:
  enableInvocationLogging: false  # Bedrock Model Invocation Logging (account-level, skipped if already configured)
  enableTransactionSearch: false  # CloudWatch Transaction Search — per-user token queries via aws/spans (account-level, skipped if already enabled)

# Log retention of the AgentCore runtime log groups
# (/aws/bedrock-agentcore/runtimes/<runtime-id>-DEFAULT). AgentCore creates these
# groups without a retention period; the stacks set one (also on groups that
# already exist).
# Must be a value CloudWatch Logs accepts: 1, 3, 5, 7, 14, 30, 60, 90, 120, 150,
# 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288 or 3653. Default: 30.
observability:
  logRetentionDays: 30

# Model configuration for the Agent (Layer 4).
# Use inference profile IDs for cross-region routing.
# Examples:
#   global.anthropic.claude-sonnet-4-6              (all regions, recommended)
#   us.anthropic.claude-sonnet-4-6                  (US regions only)
#   global.anthropic.claude-opus-4-6-v1             (all regions, higher cost)
#   us.anthropic.claude-sonnet-4-5-20250929-v1:0    (US regions only)
model:
  defaults:
    chat: "global.anthropic.claude-sonnet-4-6"
    # chat: "global.anthropic.claude-opus-4-6-v1"
    create: "global.anthropic.claude-sonnet-4-6"   # omit to inherit from chat

  # Per-user model switching in the Settings Sheet.
  # All models are enabled by default. To disable a model for end users,
  # prefix its line with `#`.
  # Each entry must be registered in infra/lib/model-metadata.ts.
  # Both defaults.chat and defaults.create must appear in this list.
  allowedModelIds:
    - "global.anthropic.claude-opus-5-5"             # latest Opus, agentic coding / long-running tasks
    - "global.anthropic.claude-sonnet-5-5"           # latest Sonnet, fast well-scoped work
    - "global.anthropic.claude-sonnet-5"             # previous Sonnet
    - "global.anthropic.claude-opus-4-8"             # previous Opus, deep reasoning
    - "global.anthropic.claude-sonnet-4-6"           # default chat/create
    - "global.anthropic.claude-opus-4-7"
    - "global.anthropic.claude-opus-4-6-v1"
    - "global.anthropic.claude-haiku-5-5"            # latest Haiku, fast and economical
    - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
    - "global.openai.gpt-6-astra"                    # Converse API (global inference profile)
    - "global.openai.gpt-6.1-sol"                    # Converse API (global inference profile), latest Sol
    - "global.openai.gpt-6-sol"                      # Converse API (global inference profile)
    - "global.openai.gpt-6-luna"                     # Converse API (global inference profile)
    - "global.openai.gpt-5.6-terra"                  # Converse API (global inference profile)
    - "global.moonshotai.kimi-k3"                    # Converse API (global inference profile)
  # Optional. Models listed here appear under a "Recommended" heading at the top
  # of the model picker; every other allowed model goes under "Other models".
  # Order within each group follows the order above. Both defaults must be in
  # this list. Remove the key for a flat list.
  recommendedModelIds:
    - "global.anthropic.claude-sonnet-4-6"           # defaults.chat / create must be listed
    - "global.anthropic.claude-sonnet-5-5"
    - "global.anthropic.claude-opus-5-5"
    - "global.openai.gpt-6.1-sol"
    - "global.anthropic.claude-haiku-5-5"

# OAuth settings for external MCP clients (Layer 3).
# enableDCR: Allow any MCP client to register dynamically via RFC 7591 (default: true).
# mcpCallbackUrls: Static OAuth callback URLs for pre-registered MCP clients.
#
# Combinations:
#   enableDCR: true  + no mcpCallbackUrls  → DCR only (default, personal/demo use)
#   enableDCR: true  + mcpCallbackUrls     → Static client + DCR (flexible)
#   enableDCR: false + mcpCallbackUrls     → Static client only (enterprise lockdown)
#   enableDCR: false + no mcpCallbackUrls  → No external MCP access (WebUI only)
#
# Sign-up for the default Cognito user pool (Web UI and MCP clients).
# selfSignUp: false (default) → an administrator creates the users (Cognito console or
#   `aws cognito-idp admin-create-user`; see docs/en/deploy-cloudshell.md).
# selfSignUp: true → people can create their own account from the sign-in page.
# allowedEmailDomains: with selfSignUp: true, only these email domains can sign up.
#   Checked by a Cognito Pre sign-up Lambda trigger; exact match, case-insensitive.
#   Subdomains are not included: list each one. Omit or leave empty for any domain.
#
# programmaticClient: an OAuth client for your own automation (scripts, cron, Lambda,
#   Step Functions) that creates decks as the signed-in user. Off by default; default
#   Cognito user pool only. Public client, authorization code + PKCE, callback
#   http://127.0.0.1:8765. refreshTokenValidityDays: how long one browser sign-in lasts
#   (1-3650, default 90). See docs/en/programmatic-access.md.
#
# auth:
#   enableDCR: true
#   mcpCallbackUrls:
#     - https://claude.ai/api/mcp/auth_callback
#     - https://claude.com/api/mcp/auth_callback
#   selfSignUp: false
#   allowedEmailDomains:
#     - example.com
#   programmaticClient:
#     enabled: false
#     refreshTokenValidityDays: 90

# WAF IP address restriction (optional).
# When specified, only the listed IP ranges can access CloudFront and API Gateway.
# waf:
#   allowedIpV4AddressRanges:
#     - "192.168.0.0/16"
#     - "10.0.0.0/8"
#   allowedIpV6AddressRanges:
#     - "2001:db8::/32"
