[project]
name = "sdpm-mcp-local"
version = "1.0.0"
description = "spec-driven-presentation-maker Local MCP Server — stdio transport for Kiro CLI, Claude Desktop, etc. (Layer 2)"
requires-python = ">=3.11"
dependencies = [
    # <2: mcp 2.0 removes mcp.server.fastmcp (FastMCP); migration tracked in #301.
    "mcp[cli]>=1.28.1,<2",
    "sdpm-skill",
    "pdfplumber>=0.11.0",
    "pypdf>=6.15.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
]

# An application, not a library: uv installs its dependencies, never builds it.
[tool.uv]
package = false

[tool.uv.sources]
sdpm-skill = { workspace = true }

[tool.ruff]
# Rule set and line length come from the workspace root.
extend = "../../pyproject.toml"
