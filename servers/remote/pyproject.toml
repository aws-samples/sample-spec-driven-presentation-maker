[project]
name = "sdpm-mcp-server"
version = "1.0.0"
description = "spec-driven-presentation-maker MCP Server — Streamable HTTP for AgentCore Runtime (Layer 3)"
requires-python = ">=3.11"
dependencies = [
    # <2: mcp 2.0 removes mcp.server.fastmcp (FastMCP); migration tracked in #301.
    "mcp[cli]>=1.28.1,<2",
    "boto3",
    "sdpm-skill",
    "aws-opentelemetry-distro>=0.10.0",
    "pypdf",
    "requests",
    "pdfplumber>=0.11.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
]

# An application, not a library: uv installs its dependencies, never builds it.
[tool.uv]
package = false

[tool.uv.sources]
sdpm-skill = { workspace = true }

[tool.ruff]
line-length = 120
