[project]
name = "spec-driven-presentation-maker"
version = "1.0.0"
description = "AI-powered PowerPoint generation toolkit — from local CLI to full-stack web app"
requires-python = ">=3.10"
dependencies = []

[tool.uv.sources]
sdpm-skill = { path = "sdpm", editable = true }

[dependency-groups]
dev = [
    "sdpm-skill",
    "pytest>=9.0.2",
    "ruff",
    "python-pptx",
    "lxml",
    "Pillow",
    "qrcode",
    "pygments>=2.19.2",
    "mcp[cli]>=1.28.1,<2",
    "boto3",
    "pytest-cov>=7.1.0",
    # shared/ingest PDF conversion (tests/test_pdf_convert.py)
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
]

[tool.ruff]
line-length = 120
src = ["sdpm", "servers/local", "servers/remote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Our own code must never emit FutureWarning (e.g. lxml element truth-testing)
    "error::FutureWarning",
    # Upstream-only: defusedxml's own __init__ imports its deprecated
    # cElementTree shim on Python 3.12. Do NOT widen this filter — the
    # security monkey patch (defuse_stdlib) must stay under scrutiny.
    "ignore:defusedxml.cElementTree is deprecated:DeprecationWarning:defusedxml",
]
