[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdpm-skill"
dynamic = ["version"]
description = "PowerPoint generation engine — JSON to PPTX with template analysis and design patterns"
requires-python = ">=3.10"
dependencies = [
    "python-pptx",
    "lxml",
    "Pillow",
    "qrcode",
    "pygments>=2.19.2",
    "defusedxml",
]

[tool.hatch.version]
path = "sdpm/__init__.py"

[tool.hatch.build]
exclude = [
    "**/.DS_Store",
    "assets/config.example.json",
]

[tool.hatch.build.targets.wheel]
packages = ["sdpm"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"sdpm/engine/converter/color.py" = ["E402"]
"sdpm/engine/converter/constants.py" = ["E402"]
"sdpm/engine/converter/slide.py" = ["E402"]
"sdpm/engine/converter/xml_helpers.py" = ["E402"]
